<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reclutamiento - GREMIO S4NGR3FRI4</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
            border-left: 5px solid #b30000;
        }
        h2 {
            text-align: center;
            color: #ff3333;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #cccccc;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 5px;
            background-color: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #ff3333;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #b30000;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #ff3333;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>GREMIO S4NGR3FRI4</h2>
    <form id="recruitmentForm">
        <div class="form-group">
            <label for="playerName">Nombre del Personaje:</label>
            <input type="text" id="playerName" name="playerName" required>
        </div>

        <div class="form-group">
            <label for="playerClass">Clase:</label>
            <select id="playerClass" name="playerClass" required>
                <option value="">Selecciona una clase</option>
                <option value="Dark Wizard">Dark Wizard</option>
                <option value="Dark Knight">Dark Knight</option>
                <option value="Fairy Elf">Fairy Elf</option>
                <option value="Magic Gladiator">Magic Gladiator</option>
                <option value="Dark Lord">Dark Lord</option>
                <option value="Summoner">Summoner</option>
                <option value="Rage Fighter">Rage Fighter</option>
                <option value="Grow Lancer">Grow Lancer</option>
                <option value="Rune Wizard">Rune Wizard</option>
                <option value="Slayer">Slayer</option>
                <option value="Gun Crusher">Gun Crusher</option>
                <option value="Light Wizard">Light Wizard</option>
                <option value="Lemuria">Lemuria</option>
                <option value="Illusion Knight">Illusion Knight</option>
            </select>
        </div>

        <div class="form-group">
            <label for="resets">Resets / Nivel:</label>
            <input type="text" id="resets" name="resets" placeholder="Ej: 500 Resets / 400 Master Level" required>
        </div>

        <div class="form-group">
            <label for="experience">Experiencia previa en el servidor:</label>
            <textarea id="experience" name="experience" rows="4" placeholder="Cuéntanos sobre tu experiencia..." required></textarea>
        </div>

        <button type="submit">Enviar Solicitud</button>
    </form>
</div>

<script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1540060827539873836/Vydsk8m80gFjye_8J0AGBnN3UY_rnD_ThkX9gO5H4mau5wyvY7FXQ_JgQqCBTk4mbZHb";

    document.getElementById('recruitmentForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const playerName = document.getElementById('playerName').value;
        const playerClass = document.getElementById('playerClass').value;
        const resets = document.getElementById('resets').value;
        const experience = document.getElementById('experience').value;

        const discordPayload = {
            embeds: [{
                title: "⚔️ Nueva Solicitud de Ingreso - S4NGR3FRI4 ⚔️",
                color: 11750400, // Color rojo oscuro corporativo
                fields: [
                    { name: "👤 Personaje", value: playerName, inline: true },
                    { name: "🛡️ Clase", value: playerClass, inline: true },
                    { name: "📊 Resets/Nivel", value: resets, inline: false },
                    { name: "💬 Experiencia", value: experience, inline: false }
                ],
                timestamp: new Date().toISOString()
            }]
        };

        fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(discordPayload)
        })
        .then(response => {
            if (response.ok) {
                alert('¡Solicitud enviada con éxito a Discord!');
                document.getElementById('recruitmentForm').reset();
            } else {
                alert('Hubo un error al enviar la solicitud.');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Error de conexión con el webhook.');
        });
    });
</script>

</body>
</html>
